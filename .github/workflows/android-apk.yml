name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory was not created."
            exit 1
          fi
          ls -la dist

      - name: Verify Capacitor configuration
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo "capacitor.config.json not found. Creating it..."
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alkhlake.mortar",
            "appName": "الرماية بالهاون",
            "webDir": "dist"
          }
          EOF
          fi

          echo "Capacitor configuration:"
          cat capacitor.config.json

      - name: Check Capacitor CLI
        run: npx cap --version

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
